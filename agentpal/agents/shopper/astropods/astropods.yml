spec: blueprint/v1
name: agentpal-shopper
agent:
  build:
    context: ../../../..
    dockerfile: agentpal/agents/shopper/astropods/Dockerfile
  interfaces:
    frontend: true
    messaging: false
  healthcheck:
    path: /health
  inputs:
    - name: GROQ_API_KEY
      datatype: string
      secret: true
    - name: OPENROUTER_API_KEY
      datatype: string
      secret: true
    - name: AGENTPAL_AGENT_KEY
      datatype: string
      secret: true
    - name: CHANNEL3_API_KEY
      datatype: string
      secret: true
    - name: AGENTPAL_BASE_URL
      datatype: string
      default: https://agentpal-api.onrender.com
dev:
  interfaces:
    frontend:
      port: 80
